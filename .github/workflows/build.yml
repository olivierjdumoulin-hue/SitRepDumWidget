private void load() {

    lines.clear();

    File f = new File(FILE);

    if (!f.exists()) {
        lines.add("widget.txt introuvable");
        lines.add(FILE);
        return;
    }

    List<String> source = new ArrayList<>();

    try (
        BufferedReader br =
            new BufferedReader(
                new FileReader(f)
            )
    ) {

        String s;

        while ((s = br.readLine()) != null) {
            if (!s.trim().isEmpty()) {
                source.add(s);
            }
        }

        trierSitRep(source);

    } catch (Exception e) {

        lines.clear();
        lines.add("Erreur lecture widget.txt");
        lines.add(e.getClass().getSimpleName());
    }
}


/*
 * Trie chaque bloc situé entre deux dates.
 *
 * Ordre :
 * 0 = rendez-vous avec heure
 * 1 = tâche contenant ¤
 * 2 = tâche contenant ^
 * 3 = [ACTION]
 * 4 = [TRAVAIL]
 * 5 = [INDIVIDUEL]
 * 6 = autres
 *
 * Les lignes techniques (jauge, météo, séparateurs,
 * bilan, etc.) restent à leur place.
 */
private void trierSitRep(List<String> source) {

    int i = 0;

    while (i < source.size()) {

        String ligne = source.get(i);

        // Première ligne / contenu avant la première date
        if (!isDate(ligne)) {
            lines.add(ligne);
            i++;
            continue;
        }

        // Date
        lines.add(ligne);
        i++;

        // Tout le contenu jusqu'à la date suivante
        List<String> bloc = new ArrayList<>();

        while (
            i < source.size() &&
            !isDate(source.get(i))
        ) {
            bloc.add(source.get(i));
            i++;
        }

        trierBloc(bloc);
    }
}


private void trierBloc(List<String> bloc) {

    /*
     * On ne veut pas déplacer les informations structurelles.
     * On trie uniquement les lignes reconnues comme RDV/tâches,
     * à l'intérieur des zones où elles se trouvent.
     */

    int debut = 0;

    while (debut < bloc.size()) {

        // Ligne qui n'est pas une tâche/RDV :
        // on la conserve exactement à sa place.
        if (!estElementTriable(bloc.get(debut))) {
            lines.add(bloc.get(debut));
            debut++;
            continue;
        }

        // Série continue de tâches/RDV
        int fin = debut;

        while (
            fin < bloc.size() &&
            estElementTriable(bloc.get(fin))
        ) {
            fin++;
        }

        List<String> groupe =
            new ArrayList<>(
                bloc.subList(debut, fin)
            );

        /*
         * Collections.sort est stable :
         * deux éléments de même priorité conservent
         * leur ordre d'origine dans widget.txt.
         */
        java.util.Collections.sort(
            groupe,
            (a, b) ->
                Integer.compare(
                    priorite(a),
                    priorite(b)
                )
        );

        lines.addAll(groupe);

        debut = fin;
    }
}


private boolean estElementTriable(String s) {

    if (s == null) {
        return false;
    }

    String t = s.trim();

    // Rendez-vous horaire
    if (RDV_LINE.matcher(t).matches()) {
        return true;
    }

    // Tâches explicitement catégorisées
    if (hasTaskTag(t)) {
        return true;
    }

    // Tâches prioritaires sans catégorie
    if (contientPrioriteForte(t)) {
        return true;
    }

    if (contientPrioriteSecondaire(t)) {
        return true;
    }

    return false;
}


private int priorite(String s) {

    if (s == null) {
        return 6;
    }

    String t = s.trim();

    // 1. Rendez-vous
    if (RDV_LINE.matcher(t).matches()) {
        return 0;
    }

    // 2. ¤ : priorité majeure
    if (contientPrioriteForte(t)) {
        return 1;
    }

    // 3. ^ : priorité secondaire
    if (contientPrioriteSecondaire(t)) {
        return 2;
    }

    // 4. ACTION
    if (t.startsWith("[ACTION]")) {
        return 3;
    }

    // 5. TRAVAIL
    if (t.startsWith("[TRAVAIL]")) {
        return 4;
    }

    // 6. INDIVIDUEL
    if (t.startsWith("[INDIVIDUEL]")) {
        return 5;
    }

    // 7. Autres
    return 6;
}


private boolean contientPrioriteForte(String s) {

    if (s == null) {
        return false;
    }

    return s.contains("¤");
}


private boolean contientPrioriteSecondaire(String s) {

    if (s == null) {
        return false;
    }

    return s.contains("^");
}
